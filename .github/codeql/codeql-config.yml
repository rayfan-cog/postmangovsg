# Local copy of opengovsg/codeql-config (prod) for this detached import.
# Upstream's custom query packs (opengovsg/*-custom-queries) are private GHCR
# packages this repo cannot read, so they are replaced by the built-in
# security-extended suite. Query filters and ignored paths match upstream.
name: CodeQL config
queries:
  - uses: security-extended
query-filters:
  - exclude:
      id: js/hardcoded-credentials
  - exclude:
      id: js/missing-rate-limiting
  - exclude:
      id: js/missing-token-validation
  - exclude:
      id: actions/missing-workflow-permissions
  - exclude:
      tags: exclude-from-incremental
paths-ignore:
  - "**/test/**"
  - "**/tests/**"
  - "**/__test__/**"
  - "**/__tests__/**"
  - "**/*.test.*"
