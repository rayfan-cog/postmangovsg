pull_request_rules:
  - name: Approve and merge non-major version dependabot upgrades
    conditions:
      - author~=^dependabot\[bot\]$
      - title~=bump [^\s]+ from ([\d]+)\..+ to \1\.
    actions:
      review:
        type: APPROVE
      merge:
        method: squash
  - name: Approve and merge grouped non-major dependabot upgrades
    conditions:
      - author~=^dependabot\[bot\]$
      - title~=bump the npm-minor-and-patch group
      - check-success=lint
      - check-success=test-backend
      - check-success=test-frontend
      - check-success=test-shared
      - check-success=test-worker
    actions:
      review:
        type: APPROVE
      merge:
        method: squash
